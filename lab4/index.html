        let counter =0;
        


        function saudar(){
            counter++;

        }

            const frase = document.querySelector('h1');
            
            frase.textContent ='texto alterado';
            frase.style.color='green';
            frase.style.backgroundColor='purple';
            frase.innerHTML='Goodbye!';
        }   


    </script>

<body>
